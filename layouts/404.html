<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — {{ .Site.Title }}</title>
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
</head>
<body>
  <div class="frame">
    {{ partial "head.html" . }}
    <main class="intro">
      <p class="mono" style="color:var(--accent);letter-spacing:.1em">ERROR / 404</p>
      <h1 class="intro__title">页面<span class="intro__slash">/</span>未找到</h1>
      <p class="intro__lead">这个地址没有对应的文件夹。</p>
      <p><a class="btn" href="{{ "/index/" | relURL }}">前往资源目录 →</a></p>
    </main>
    {{ partial "foot.html" . }}
  </div>
</body>
</html>
