baseURL = "https://public.dagongren.tech/"
# 必须真实域名：sitemap.xml 要输出绝对地址，IndexNow 提交依赖它
locale = "zh-CN"
title = "DL / INDEX"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "资源分享站 · 网盘资源索引"
  author = "CyL-Cly"

[markup.goldmark.renderer]
  unsafe = true

[build]
  writeStats = false

[caches]
  [caches.images]
    dir = ":cacheDir/images"
